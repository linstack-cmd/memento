server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache static assets aggressively (no build hashing, so short cache)
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300";
    }
}
