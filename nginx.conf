# TETHER — nginx config (static serving of public/ only).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip for text assets
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 256;

    # Long-lived immutable cache for hashed/static assets is not used (no build
    # hashing), so use a short cache and rely on deploy-time busting.
    location /css/ {
        expires 1h;
        add_header Cache-Control "public";
    }
    location /js/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # SPA fallback to index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # no server-side execution; never serve dotfiles
    location ~ /\. { deny all; }
}
