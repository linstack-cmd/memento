<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06131a">
  <title>TETHER — a luminous moth ascending a derelict greenhouse</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game" width="960" height="540"></canvas>

      <!-- HUD -->
      <div id="hud" class="hidden">
        <div class="hud-left">
          <span id="hud-level" class="hud-chip"></span>
          <span id="hud-motes" class="hud-chip"></span>
        </div>
        <div class="hud-center">
          <span id="hud-cooldown" class="hud-chip"></span>
        </div>
        <div class="hud-right">
          <span id="hud-deaths" class="hud-chip"></span>
          <button id="btn-mute" class="hud-btn" title="Mute (M)">♪</button>
          <button id="btn-pause" class="hud-btn" title="Pause (P)">❚❚</button>
        </div>
      </div>

      <!-- Overlays -->
      <div id="overlay-title" class="overlay">
        <div class="panel">
          <h1 class="title-word">TETHER</h1>
          <p class="subtitle">the last light-moth ascending a derelict greenhouse</p>
          <p class="hint">Place a light anchor — press again to recall to it. Collect every mote to open the gate.</p>
          <div class="keys">
            <span>← → / A D move</span><span>Space / W / ↑ jump</span><span>X / K tether</span>
            <span>↓+jump drop</span><span>P pause</span><span>R restart</span>
          </div>
          <button id="btn-play" class="btn-big">Begin the Ascent</button>
          <button id="btn-continue" class="btn-big hidden">Continue</button>
          <div id="title-progress"></div>
        </div>
      </div>

      <div id="overlay-levelintro" class="overlay hidden">
        <div class="panel small">
          <h2 id="intro-name"></h2>
          <p id="intro-hint" class="hint"></p>
        </div>
      </div>

      <div id="overlay-complete" class="overlay hidden">
        <div class="panel">
          <h2 id="complete-title"></h2>
          <p id="complete-stats"></p>
          <button id="btn-next" class="btn-big">Ascend</button>
        </div>
      </div>

      <div id="overlay-end" class="overlay hidden">
        <div class="panel">
          <h2 class="title-word">The Sky, Relit</h2>
          <p id="end-stats"></p>
          <button id="btn-replay" class="btn-big">Fly Again</button>
        </div>
      </div>

      <div id="overlay-pause" class="overlay dim hidden">
        <div class="panel small">
          <h2>Paused</h2>
          <button id="btn-resume" class="btn-big">Resume</button>
          <button id="btn-restart" class="btn">Restart Level</button>
          <button id="btn-motion" class="btn">Reduce Motion: Off</button>
          <button id="btn-quit" class="btn">Quit to Title</button>
        </div>
      </div>
    </div>
  </div>
  <noscript><p style="color:#fff;text-align:center;padding:2rem">TETHER needs JavaScript to fly.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
