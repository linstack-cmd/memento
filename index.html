<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEMENTO — collect the light</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>
  <div id="frame">
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="hud-left">
        <span class="hud-label">fragments</span>
        <span id="hud-orbs">0 / 0</span>
      </div>
      <div id="hud-right">
        <span class="hud-label">depth</span>
        <span id="hud-level">I</span>
      </div>
    </div>

    <div id="overlay" class="hidden">
      <div id="overlay-inner">
        <h1 id="overlay-title">MEMENTO</h1>
        <p id="overlay-sub">the world went dark, and the memories scattered.<br/>you are the last light left.</p>
        <button id="overlay-btn">begin</button>
        <p class="hint">move &nbsp;←&nbsp;→ &nbsp;/&nbsp; A&nbsp;D &nbsp;&nbsp;·&nbsp;&nbsp; jump &nbsp;SPACE&nbsp;/&nbsp;W&nbsp;/&nbsp;↑ &nbsp;&nbsp;·&nbsp;&nbsp; double-jump in the air</p>
      </div>
    </div>

    <div id="vignette"></div>
  </div>
  <script src="js/game.js?v=2"></script>
</body>
</html>
